  {no:"No.22", q:"1920年代のアメリカで中産階級が成長し、クレジット販売の一般化とともに到来した社会", a:"大量消費社会"},
  {no:"No.22", q:"1920年代のアメリカ社会の中核を占めた「ホワイト・アングロサクソン・プロテスタント」の略称", a:"WASP"},
  {no:"No.22", q:"1924年、アメリカで国別割当て法により新移民を制限し、アジア諸国の移民を全面禁止した法律", a:"移民法（排日移民法）"},
  {no:"No.22", q:"1919年、プロテスタント的価値観から制定され、ギャングによる密造酒密売を招いた法律", a:"禁酒法"},
  {no:"No.22", q:"1920年代に全盛となった、反黒人・反新移民・反カトリック・反ユダヤを掲げる秘密結社", a:"KKK（クー＝クラックス＝クラン）"}
];

let currentFilter = "すべて";
let onlyUnlearned = false;
let currentIndex = 0;
let isFlipped = false;
let learnedSet = new Set();
let deck = [...allCards];

function initTabs() {
  const nos = ["すべて", "No.14", "No.15", "No.16", "No.17", "No.18", "No.19", "No.20", "No.21", "No.22"];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  nos.forEach(no => {
    const btn = document.createElement("button");
    btn.className = "tab" + (no === currentFilter ? " active" : "");
    btn.textContent = no;
    btn.onclick = () => {
      currentFilter = no;
      applyFilter();
    };
    tabsEl.appendChild(btn);
  });
}

function applyFilter() {
  deck = allCards.filter((card, idx) => {
    const matchNo = (currentFilter === "すべて" || card.no === currentFilter);
    const matchLearned = (!onlyUnlearned || !learnedSet.has(card.q));
    return matchNo && matchLearned;
  });
  currentIndex = 0;
  isFlipped = false;
  initTabs();
  renderCard();
}

function renderCard() {
  const cardEl = document.getElementById("card");
  const badgeEl = document.getElementById("card-badge");
  const textEl = document.getElementById("card-text");
  const counterEl = document.getElementById("counter");
  const learnedEl = document.getElementById("learned-count");

  learnedEl.textContent = "習得済み: " + learnedSet.size + " / " + allCards.length;

  if (deck.length === 0) {
    cardEl.className = "card";
    badgeEl.textContent = "完了";
    textEl.textContent = "この範囲の未習得カードはありません！";
    counterEl.textContent = "0 / 0";
    return;
  }

  const item = deck[currentIndex];
  counterEl.textContent = (currentIndex + 1) + " / " + deck.length;

  if (isFlipped) {
    cardEl.className = "card answer-mode";
    badgeEl.textContent = item.no + " 【答え】";
    textEl.textContent = item.a;
  } else {
    cardEl.className = "card";
    badgeEl.textContent = item.no + " 【問題】";
    textEl.textContent = item.q;
  }
}

function flipCard() {
  if (deck.length === 0) return;
  isFlipped = !isFlipped;
  renderCard();
}

function nextCard() {
  if (deck.length === 0) return;
  currentIndex = (currentIndex + 1) % deck.length;
  isFlipped = false;
  renderCard();
}

function prevCard() {
  if (deck.length === 0) return;
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  isFlipped = false;
  renderCard();
}

function markCard(learned) {
  if (deck.length === 0) return;
  const q = deck[currentIndex].q;
  if (learned) {
    learnedSet.add(q);
  } else {
    learnedSet.delete(q);
  }
  if (onlyUnlearned && learned) {
    applyFilter();
  } else {
    nextCard();
  }
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  isFlipped = false;
  renderCard();
}

function toggleUnlearned() {
  onlyUnlearned = !onlyUnlearned;
  document.getElementById("filter-btn").classList.toggle("active", onlyUnlearned);
  applyFilter();
}

initTabs();
renderCard();
</script>
</body>
</html>
